<!DOCTYPE html>
<html>
<head><title>Logo SVG Test</title>
<style>
body { font-family: sans-serif; padding: 40px; }
.row { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; padding: 20px; border-radius: 12px; }
.light { background: #f5f5f5; }
.dark { background: #170531; }
.row img { height: 48px; width: auto; }
.label { min-width: 120px; font-weight: 600; font-size: 14px; }
.light .label { color: #333; }
.dark .label { color: #fff; }
</style>
</head>
<body>
<h2>SVG Logo Variants</h2>
<div class="row light"><span class="label">Dark SVG</span><img src="/images/logos/fudumala-2026-dark.svg"></div>
<div class="row light"><span class="label">Default SVG</span><img src="/images/logos/fudumala-2026-default.svg"></div>
<div class="row light"><span class="label">Purple SVG</span><img src="/images/logos/fudumala-2026-purple.svg"></div>
<div class="row dark"><span class="label">White SVG</span><img src="/images/logos/fudumala-2026-white.svg"></div>

<h2>PNG Fallbacks</h2>
<div class="row light"><span class="label">Dark PNG</span><img src="/images/logos/fudumala-2026-dark.png"></div>
<div class="row light"><span class="label">Default PNG</span><img src="/images/logos/fudumala-2026-horizontal.png"></div>
<div class="row light"><span class="label">Purple PNG</span><img src="/images/logos/fudumala-2026-purple.png"></div>
<div class="row dark"><span class="label">White PNG</span><img src="/images/logos/fudumala-2026-white.png"></div>
</body>
</html>
